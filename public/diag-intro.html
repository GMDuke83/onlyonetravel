<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ONLYONE · Intro-Diagnose</title>
<meta name="theme-color" content="#15100B">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box }
  body{ margin:0; background:#15100B; color:#F2EDE4;
        font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
        padding:18px 16px calc(28px + env(safe-area-inset-bottom,0px)); }
  h1{ font-size:15px; letter-spacing:.14em; text-transform:uppercase; margin:0 0 4px; color:#D8B45C }
  p.sub{ margin:0 0 18px; font-size:12px; color:#9A9186 }
  h2{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#D8B45C;
      margin:22px 0 8px; padding-bottom:6px; border-bottom:1px solid #2C2419 }
  table{ width:100%; border-collapse:collapse; font-size:13px }
  td{ padding:5px 0; vertical-align:top; border-bottom:1px solid #221B12 }
  td:first-child{ color:#9A9186; width:44%; padding-right:10px }
  td:last-child{ font-weight:600; word-break:break-word }
  .good{ color:#7FBF6A } .bad{ color:#E2705B } .warn{ color:#E0B44A }
  video{ width:100%; max-width:220px; border-radius:2px; background:#000; margin-top:10px; display:block }
  #log{ font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap;
        background:#0E0A06; border:1px solid #2C2419; border-radius:2px;
        padding:10px; max-height:44vh; overflow:auto; margin-top:8px }
  button{ -webkit-appearance:none; appearance:none; width:100%; margin-top:14px;
          padding:15px; border:0; border-radius:2px; background:#D8B45C; color:#15100B;
          font:inherit; font-weight:700; letter-spacing:.1em; text-transform:uppercase; cursor:pointer }
  button.ghost{ background:transparent; color:#D8B45C; border:1px solid #4A3D28 }
  .verdict{ margin-top:16px; padding:14px; border-radius:2px; border:1px solid #2C2419; background:#0E0A06;
            font-size:13px; line-height:1.55 }
</style>
</head>
<body>

<h1>Intro-Diagnose</h1>
<p class="sub">Diese Seite startet dasselbe Video wie das Intro, mit denselben Attributen —
und schreibt mit, was das Gerät damit macht. Einfach liegen lassen, ca. 15 Sekunden.</p>

<div class="verdict" id="verdict">läuft …</div>

<h2>Umgebung</h2>
<table id="env"></table>

<h2>Das Video</h2>
<video id="v" autoplay muted playsinline webkit-playsinline preload="auto"
       fetchpriority="high" disablepictureinpicture disableremoteplayback x5-playsinline
       poster="./images/onlyone-hero-poster.webp">
  <source src="./video/onlyone-hero-ocean-v4.mp4" type="video/mp4">
</video>
<table id="state"></table>

<h2>Verlauf</h2>
<div id="log"></div>

<button id="copy">Bericht kopieren</button>
<button class="ghost" id="again">Nochmal messen</button>

<script>
(function(){
  "use strict";
  var v = document.getElementById('v');
  var logEl = document.getElementById('log');
  var t0 = Date.now();
  var lines = [];
  var firstFrameAt = null;
  var playError = null;
  var mediaFailed = null;
  var sampler = null;

  function ms(){ return String(Date.now() - t0).padStart(5,' ') + 'ms'; }
  function log(s){
    lines.push(ms() + '  ' + s);
    logEl.textContent = lines.join('\n');
    logEl.scrollTop = logEl.scrollHeight;
  }
  function rows(tbl, pairs){
    tbl.innerHTML = pairs.map(function(p){
      var cls = p[2] ? ' class="' + p[2] + '"' : '';
      return '<tr><td>' + p[0] + '</td><td' + cls + '>' + p[1] + '</td></tr>';
    }).join('');
  }

  /* ---- Umgebung ---------------------------------------------------------- */
  function autoplayPolicy(){
    try {
      if (typeof navigator.getAutoplayPolicy === 'function') {
        return navigator.getAutoplayPolicy('mediaelement');
      }
    } catch (e) {}
    return '(Browser kennt die Abfrage nicht)';
  }
  var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection || null;
  var pol = autoplayPolicy();
  var h264 = v.canPlayType('video/mp4; codecs="avc1.42E01E"') || '(nein)';
  var aac  = v.canPlayType('audio/mp4; codecs="mp4a.40.2"') || '(nein)';
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) ||
                   navigator.standalone === true;

  rows(document.getElementById('env'), [
    ['Autoplay-Politik', pol,
      pol === 'allowed' ? 'good' : (pol === 'allowed-muted' ? 'good' : (pol === 'disallowed' ? 'bad' : 'warn'))],
    ['Datensparmodus', c && typeof c.saveData === 'boolean' ? (c.saveData ? 'AN — blockt Autoplay' : 'aus') : 'unbekannt',
      c && c.saveData ? 'bad' : ''],
    ['Verbindung', c ? ((c.effectiveType || '?') + ', ' + (c.downlink != null ? c.downlink + ' Mbit/s' : '?')) : 'unbekannt'],
    ['H.264 abspielbar', h264, h264 === '(nein)' ? 'bad' : 'good'],
    ['AAC abspielbar', aac, aac === '(nein)' ? 'bad' : 'good'],
    ['Modus', standalone ? 'installierte App (standalone)' : 'Browser-Tab'],
    ['Build', (window.ONLYONE_BUILD || '(diese Seite lädt app.js nicht)')],
    ['Gerät', navigator.userAgent]
  ]);

  /* ---- Ereignisse -------------------------------------------------------- */
  ['loadstart','loadedmetadata','loadeddata','canplay','canplaythrough','play','playing',
   'pause','waiting','stalled','suspend','abort','emptied','ended','error','ratechange'
  ].forEach(function(ev){
    v.addEventListener(ev, function(){
      var extra = '';
      if (ev === 'error' && v.error) extra = '  code=' + v.error.code + ' ' + (v.error.message || '');
      log('event: ' + ev + extra);
    });
  });
  var src = v.querySelector('source');
  if (src) src.addEventListener('error', function(){
    log('event: source error — Datei nicht ladbar');
    mediaFailed = 'Die Videodatei konnte nicht geladen oder nicht dekodiert werden.';
    verdict();
  });
  v.addEventListener('error', function(){
    mediaFailed = 'Medienfehler' + (v.error ? ' (code ' + v.error.code + ')' : '');
    verdict();
  });

  v.addEventListener('timeupdate', function(){
    if (firstFrameAt === null && v.currentTime > 0.05) {
      firstFrameAt = Date.now() - t0;
      log('>>> erstes Bild läuft nach ' + firstFrameAt + 'ms');
      verdict();
    }
  });

  /* ---- der Startversuch, genau wie im Intro ------------------------------ */
  log('play() wird gerufen, muted=' + v.muted);
  var p = v.play();
  if (p && typeof p.then === 'function') {
    p.then(function(){ log('play() aufgelöst — Wiedergabe erlaubt'); })
     .catch(function(err){
       playError = (err && err.name ? err.name : 'Error') + ': ' + (err && err.message ? err.message : '');
       log('play() ABGELEHNT — ' + playError);
       verdict();
     });
  } else {
    log('play() liefert kein Promise (sehr alter Browser)');
  }

  /* ---- laufende Messung -------------------------------------------------- */
  function bufferedEnd(){
    try { return v.buffered.length ? v.buffered.end(v.buffered.length - 1) : 0; } catch (e) { return 0; }
  }
  var READY = ['0 nichts','1 Metadaten','2 aktuelles Bild','3 kann weiterlaufen','4 komplett'];
  function sample(){
    rows(document.getElementById('state'), [
      ['pausiert', v.paused ? 'JA' : 'nein', v.paused ? 'bad' : 'good'],
      ['Position', v.currentTime.toFixed(2) + ' s'],
      ['readyState', READY[v.readyState] || v.readyState],
      ['geladen bis', bufferedEnd().toFixed(2) + ' s'],
      ['Länge', isFinite(v.duration) ? v.duration.toFixed(2) + ' s' : '—'],
      ['stumm', v.muted ? 'ja' : 'NEIN', v.muted ? '' : 'warn'],
      ['erstes Bild nach', firstFrameAt !== null ? firstFrameAt + ' ms' : '— noch nicht —',
        firstFrameAt !== null ? 'good' : 'warn'],
      ['play()-Fehler', playError || '— keiner —', playError ? 'bad' : 'good']
    ]);
  }

  /* ---- das Urteil -------------------------------------------------------- */
  var settled = false;
  function verdict(){
    if (settled) return;
    var el = document.getElementById('verdict');
    if (firstFrameAt !== null) {
      settled = true;
      el.innerHTML = firstFrameAt <= 1200
        ? '<b class="good">Autoplay funktioniert.</b> Das Video lief nach ' + firstFrameAt +
          ' ms von selbst — innerhalb der 1,2 s, nach denen das Intro den Startknopf zeigt. ' +
          'Der Knopf dürfte bei dir gar nicht erscheinen.'
        : '<b class="warn">Autoplay funktioniert, ist aber zu langsam.</b> Das Video lief erst nach ' +
          firstFrameAt + ' ms — das Intro zeigt den Startknopf aber schon nach 1200 ms. ' +
          'Der Knopf erscheint also, obwohl nichts kaputt ist: er ist nur zu früh dran.';
      return;
    }
    if (playError) {
      settled = true;
      el.innerHTML = '<b class="bad">Autoplay wurde abgelehnt.</b> ' + playError +
        ' — hier hilft kein längeres Warten, das Gerät verweigert den Start. ' +
        'Die Zeilen „Autoplay-Politik" und „Datensparmodus" oben sagen, warum.';
      return;
    }
    if (mediaFailed) {
      settled = true;
      el.innerHTML = '<b class="bad">Das Video selbst ist das Problem.</b> ' + mediaFailed +
        ' Das ist kein Autoplay-Thema — sieh in der Zeile „H.264 abspielbar" nach.';
    }
  }

  sampler = setInterval(function(){
    sample();
    if (!settled && Date.now() - t0 > 15000) {
      settled = true;
      document.getElementById('verdict').innerHTML =
        '<b class="bad">Nach 15 s läuft nichts.</b> geladen bis ' + bufferedEnd().toFixed(2) +
        ' s, readyState ' + v.readyState + '. Wenn „geladen bis" bei 0 steht, kommt die Datei nicht an; ' +
        'steht dort etwas, kann das Gerät sie nicht dekodieren.';
    }
  }, 250);
  sample();

  /* ---- Knöpfe ------------------------------------------------------------ */
  document.getElementById('copy').addEventListener('click', function(){
    var txt = 'ONLYONE Intro-Diagnose\n' +
      Array.prototype.map.call(document.querySelectorAll('#env tr, #state tr'), function(tr){
        return tr.cells[0].textContent + ': ' + tr.cells[1].textContent;
      }).join('\n') + '\n\nVerlauf:\n' + lines.join('\n');
    function done(ok){ this.textContent = ok ? 'Kopiert' : 'Kopieren ging nicht — Text markieren'; }
    var self = this;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt)
        .then(function(){ self.textContent = 'Kopiert'; })
        .catch(function(){ self.textContent = 'Kopieren ging nicht — Text markieren'; });
    } else {
      self.textContent = 'Kopieren ging nicht — Text markieren';
    }
  });
  document.getElementById('again').addEventListener('click', function(){
    location.replace(location.pathname + '?r=' + Date.now());
  });
})();
</script>
</body>
</html>
