<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}
#stage{position:relative;display:inline-block}
#decal{position:absolute;inset:0;pointer-events:none}</style>
<div id="stage"><svg id="decal"></svg></div>
<script type="importmap">
{"imports":{"three":"/three/three.module.js","three/addons/":"/three/addons/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = +(new URLSearchParams(location.search).get('w') || 1400);
const H = +(new URLSearchParams(location.search).get('h') || 2400);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
const stage = document.getElementById('stage');
stage.insertBefore(renderer.domElement, stage.firstChild);
const decal = document.getElementById('decal');
decal.setAttribute('width', W); decal.setAttribute('height', H);
decal.setAttribute('viewBox', `0 0 ${W} ${H}`);

const scene = new THREE.Scene();

/* A metal surface is only as good as what it reflects. A flat directional rig
   leaves the fuselage looking like grey plastic, so the studio itself is the
   light source: RoomEnvironment through PMREM gives the long soft highlight
   that runs down the spine of the airframe. */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* Studio light: a soft key from the front-top, a cool fill from behind and a
   warm rim, so the fuselage reads as a metal cylinder rather than a flat cut-out. */
scene.add(new THREE.HemisphereLight(0xffffff, 0x6b5b49, 1.15));
const key = new THREE.DirectionalLight(0xfff4e2, 2.6); key.position.set(-3, 6, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8f0, 1.0); fill.position.set(4, 2, -5); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffd9a0, 1.4); rim.position.set(0, -4, -3); scene.add(rim);

const loader = new GLTFLoader();
loader.load('/model/scene.gltf', gltf => {
  const root = gltf.scene;

  /* Repaint. The donor model wears a real airline's livery, which cannot go on
     another company's site — so the textured material is replaced by a plain
     pearl-ivory metal in the brand's own palette. Only the geometry is used. */
  const paint = new THREE.MeshPhysicalMaterial({
    color: 0xC9A96B,          // champagne — the brand gold, not a chrome mirror
    metalness: 0.92,
    roughness: 0.30,
    clearcoat: 0.85,
    clearcoatRoughness: 0.18,
    envMapIntensity: 1.5,
  });
  root.traverse(o => {
    if (o.isMesh) { o.material = paint; }
  });

  // normalise: centre at origin, longest axis to a known length
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  root.position.sub(center);

  const pivot = new THREE.Group();
  pivot.add(root);
  scene.add(pivot);
  root.updateMatrixWorld(true);        // the re-centre above has to be baked in

  const noseZ = size.z * 0.5;

  // top-down: camera above, looking straight down, nose pointing to +Y on screen
  const longest = Math.max(size.x, size.y, size.z);
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 1000);
  const aspect = W / H;
  const halfH = longest * 0.56;          // a little air around the airframe
  const halfW = halfH * aspect;
  cam.left = -halfW; cam.right = halfW; cam.top = halfH; cam.bottom = -halfH;
  cam.position.set(0, 400, 0);
  cam.up.set(0, 0, 1);                   // nose to the top of the frame
  cam.lookAt(0, 0, 0);
  cam.updateProjectionMatrix();

  const yaw = +(new URLSearchParams(location.search).get('yaw') || 0);
  pivot.rotation.y = yaw * Math.PI / 180;

  renderer.render(scene, cam);

  /* Windshield, drawn instead of modelled. The donor texture carried the
     glazing, so the repainted nose was a blank capsule, and rebuilding it as
     3D domes read as blobs stuck onto the hull. The view is a fixed top-down
     orthographic frame, so a flat decal projected with the same camera is
     pixel-identical to geometry — and its outline can be exactly the swept
     two-panel shape a modern jet shows from above.

     Everything is measured, not hand-placed: down-rays find the silhouette
     half-width of the hull at each station, cam.project turns the 3D points
     into pixels. */
  const ray = new THREE.Raycaster();
  const down = new THREE.Vector3(0, -1, 0);
  const hitAt = (x, z) => {
    ray.set(new THREE.Vector3(x, size.y * 4, z), down);
    return ray.intersectObject(root, true)[0] || null;
  };
  const halfWidthAt = z => {          // scan out until the down-ray misses
    let lo = 0, hi = size.x;
    for (let i = 0; i < 24; i++) {
      const m = (lo + hi) / 2;
      if (hitAt(m, z)) lo = m; else hi = m;
    }
    return lo;
  };
  const px = (x, z) => {
    const v = new THREE.Vector3(x, size.y * 0.5, z).project(cam);
    return [ (v.x + 1) / 2 * W, (1 - (v.y + 1) / 2) * H ];
  };

  const zF = noseZ * 0.800;            // leading edge of the glass
  const zR = noseZ * 0.718;            // trailing edge
  const wF = halfWidthAt(zF) * 0.58;
  const wR = halfWidthAt(zR) * 0.74;
  const [xf1, yF] = px(-wF, zF), [xf2] = px(wF, zF);
  const [xr1, yR] = px(-wR, zR), [xr2] = px(wR, zR);
  const [cx]      = px(0, zF);
  const arc = (yR - yF) * 0.42;        // how far the front edge bows forward

  const NS='http://www.w3.org/2000/svg';
  const defs=document.createElementNS(NS,'defs');
  defs.innerHTML =
    `<linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
       <stop offset="0" stop-color="#22201E"/>
       <stop offset=".45" stop-color="#0F0D0C"/>
       <stop offset="1" stop-color="#242120"/>
     </linearGradient>`;
  decal.appendChild(defs);

  const shape=document.createElementNS(NS,'path');
  /* Front edge bows forward following the nose curve; the sides sweep back and
     out; the rear edge is nearly straight with a slight centre peak — the
     planform of a two-panel wraparound windshield. */
  shape.setAttribute('d',
    `M ${xf1} ${yF}
     Q ${cx} ${yF - arc} ${xf2} ${yF}
     L ${xr2} ${yR}
     Q ${cx} ${yR + arc * 0.30} ${xr1} ${yR}
     Z`);
  shape.setAttribute('fill','url(#g)');
  shape.setAttribute('stroke','#080706');
  shape.setAttribute('stroke-width','2');
  shape.setAttribute('stroke-linejoin','round');
  decal.appendChild(shape);

  const divider=document.createElementNS(NS,'line');   // centre post
  divider.setAttribute('x1',cx); divider.setAttribute('y1',yF - arc*0.72);
  divider.setAttribute('x2',cx); divider.setAttribute('y2',yR + arc*0.26);
  divider.setAttribute('stroke','#3A342F'); divider.setAttribute('stroke-width','3');
  decal.appendChild(divider);

  const glint=document.createElementNS(NS,'path');     // one soft specular
  glint.setAttribute('d',
    `M ${xf1 + (xf2-xf1)*0.16} ${yF + (yR-yF)*0.30}
     Q ${cx} ${yF - arc*0.30} ${xf1 + (xf2-xf1)*0.80} ${yF + (yR-yF)*0.22}`);
  glint.setAttribute('fill','none');
  glint.setAttribute('stroke','rgba(255,255,255,.42)');
  glint.setAttribute('stroke-width','4');
  glint.setAttribute('stroke-linecap','round');
  decal.appendChild(glint);

  window.__dims = {sx:size.x, sy:size.y, sz:size.z};
  window.__ready = true;
}, undefined, err => { window.__error = String(err); window.__ready = true; });
</script>
