name: Platform checks
on:
  pull_request:
  push:
    branches: [codex/oo-travel-platform]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run check:functions
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate:local
      - name: Local-only browser fixture
        run: |
          printf 'ALLOW_LEGACY_STAFF="true"\nSTAFF_LOGIN_KEY="local-test-only-staff-key-12345678901234567890"\nSITE_URL="http://localhost:8791"\n' > .dev.vars
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
