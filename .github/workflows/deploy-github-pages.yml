name: Deploy to GitHub Pages

# Publishes public/ to GitHub Pages.
#
# GitHub Pages can otherwise only serve the repository root or /docs — this
# workflow uploads public/ as the Pages artifact, so no files have to move.
#
# Before the first run, enable it once:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# Requirements:
#   * public repository (Pages on a private repo needs a paid GitHub plan)
#
# Result: https://gmduke83.github.io/onlyonetravel/
#
# The app uses document-relative paths, so it works under that sub-path as
# well as at a domain root later.
#
# Why this deploys from `main` and not `develop`
# ----------------------------------------------
# GitHub creates the `github-pages` environment on its own and, by default,
# only lets the repository's DEFAULT branch deploy into it. Running this on
# `develop` fails with:
#
#   Branch "develop" is not allowed to deploy to github-pages
#   due to environment protection rules.
#
# To publish from `develop` instead, allow it once under
#   Settings → Environments → github-pages → Deployment branches
# and then add `develop` to the branch list below.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; let a running one finish.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the hero video is a real file
        run: |
          set -e
          video="public/video/onlyone-hero-ocean-v2.mp4"
          test -f "$video" || { echo "::error::$video is missing"; exit 1; }

          # Guard the rule that matters most: the video must never be inlined.
          if grep -qE 'data:video/|VIDEO_B64' public/index.html public/js/app.js; then
            echo "::error::A video appears to be embedded in the page. It must be served as a file."
            exit 1
          fi

          bytes=$(stat -c%s "$video")
          echo "hero video: $bytes bytes"
          [ "$bytes" -gt 100000 ] || { echo "::error::hero video looks truncated"; exit 1; }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload public/
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
